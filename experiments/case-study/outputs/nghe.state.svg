<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2119 720" role="img" aria-label="state machine"><style>
    text{font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;fill:#1E2328}
    .region-label{font-size:12px;font-style:italic;fill:#6F6C66}
    .state rect{fill:#FFFFFF;stroke:#4B4F55;stroke-width:1.2;rx:6}
    .state .sv{font-size:11px;fill:#4B4F55}
    .region rect.frame{fill:none;stroke:#4B4F55;stroke-width:1.4;rx:10}
    .region-sep{stroke:#4B4F55;stroke-width:1;stroke-dasharray:6 4}
    .transition path{fill:none;stroke:#1E6E8C;stroke-width:1.4;marker-end:url(#t2a-arrow)}
    .transition text{font-size:11px;fill:#1E2328}
    .transition rect.lbl{fill:#F6F5F0;stroke:#D9D6CE;stroke-width:.6;rx:3}
    .transition:hover path{stroke-width:2.6}
    .transition:hover text{font-weight:600}
    .initial circle{fill:#1E2328}
    .initial line{stroke:#1E2328;stroke-width:1.4;marker-end:url(#t2a-arrow)}
    .tab{fill:#F6F5F0;stroke:#4B4F55;stroke-width:1.4}
    .frame{fill:none;stroke:#4B4F55;stroke-width:1.4;rx:10}
    @media (prefers-color-scheme: dark){
      text{fill:#E6E4DE} .region-label{fill:#8B8880}
      .state rect{fill:#1C2026;stroke:#B8B5AE} .state .sv{fill:#B8B5AE}
      .region rect.frame,.frame{stroke:#B8B5AE} .region-sep{stroke:#B8B5AE}
      .transition path{stroke:#5FAFD0} .transition text{fill:#E6E4DE}
      .transition rect.lbl{fill:#15181C;stroke:#333941}
      .initial circle{fill:#E6E4DE} .initial line{stroke:#E6E4DE}
      .tab{fill:#1C2026;stroke:#B8B5AE}
    }
  </style>
<defs><marker id="t2a-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect class="frame" x="28" y="28" width="2062.6" height="664" rx="10"/>
<path class="tab" d="M28 28 h282 v26 h-282 z"/>
<text x="40" y="45" font-size="13" font-weight="600">NGHE 72-hour autonomous construction</text>
<g class="region" data-id="r0">
<text class="region-label" x="46" y="96">autonomy_level</text>
<g class="initial"><circle cx="12" cy="190" r="7"/><line x1="19" y1="190" x2="49" y2="190" marker-end="url(#t2a-arrow)"/></g>
<g class="state" data-id="NGHE_SIT_LEVEL3">
<rect x="52" y="162" width="240" height="56" rx="6"/>
<text x="68" y="182" font-size="14">Level 3 supervised autonomy</text>
<line x1="52" y1="192" x2="292" y2="192" stroke="#4B4F55" stroke-width=".8"/>
<text class="sv" x="68" y="208">autonomy_level = Level 3</text>
</g>
<g class="state" data-id="NGHE_SIT_LEVEL4">
<rect x="613.1000000000001" y="162" width="194" height="56" rx="6"/>
<text x="629.1000000000001" y="182" font-size="14">Level 4 full autonomy</text>
<line x1="613.1000000000001" y1="192" x2="807.1000000000001" y2="192" stroke="#4B4F55" stroke-width=".8"/>
<text class="sv" x="629.1000000000001" y="208">autonomy_level = Level 4</text>
</g>
<g class="state" data-id="NGHE_SIT_LEVEL1_STOP">
<rect x="1771.6" y="162" width="202" height="74" rx="6"/>
<text x="1787.6" y="182" font-size="14">Level 1 emergency stop</text>
<line x1="1771.6" y1="192" x2="1973.6" y2="192" stroke="#4B4F55" stroke-width=".8"/>
<text class="sv" x="1787.6" y="208">autonomy_level = Level 1</text>
<text class="sv" x="1787.6" y="226">rainfall_rate = 30 mm/h</text>
</g>
<g class="state" data-id="NGHE_SIT_MISSION_COMPLETE">
<rect x="1355.7" y="162" width="217" height="92" rx="6"/>
<text x="1371.7" y="182" font-size="14">72-hour mission complete</text>
<line x1="1355.7" y1="192" x2="1572.7" y2="192" stroke="#4B4F55" stroke-width=".8"/>
<text class="sv" x="1371.7" y="208">target_volume = 38000 m3</text>
<text class="sv" x="1371.7" y="226">actual_volume = 38200 m3</text>
<text class="sv" x="1371.7" y="244">human_accident_count = 0</text>
</g>
<g class="state" data-id="NGHE_SIT_LEVEL3_FOG">
<rect x="1355.7" y="276" width="279" height="92" rx="6"/>
<text x="1371.7" y="296" font-size="14">Level 3 limited operation in fog</text>
<line x1="1355.7" y1="306" x2="1634.7" y2="306" stroke="#4B4F55" stroke-width=".8"/>
<text class="sv" x="1371.7" y="322">autonomy_level = Level 3</text>
<text class="sv" x="1371.7" y="340">visibility = 200 m</text>
<text class="sv" x="1371.7" y="358">speed_limit = 5 km/h</text>
</g>
<g class="transition" data-id="NGHE_TR_LEVEL3_TO_LEVEL4">
<path d="M292 190 C452.55000000000007 190, 452.55000000000007 190, 613.1000000000001 190"/>
<rect class="lbl" x="377.55000000000007" y="169" width="150" height="18"/>
<text x="452.55000000000007" y="182" text-anchor="middle">Level 4 switch approved</text>
</g>
<g class="transition" data-id="NGHE_TR_LEVEL4_TO_LEVEL3_FOG">
<path d="M807.1000000000001 190 C1081.4 190, 1081.4 322, 1355.7 322"/>
<rect class="lbl" x="897.9000000000001" y="235" width="367" height="18"/>
<text x="1081.4" y="248" text-anchor="middle">Dense fog occurs [speed &lt;= 5 km/h during fog degraded mode]</text>
</g>
<g class="transition" data-id="NGHE_TR_LEVEL3_FOG_TO_LEVEL1_RAIN">
<path d="M1634.7 322 C1703.15 322, 1703.15 199, 1771.6 199"/>
<rect class="lbl" x="1643.6500000000003" y="239.5" width="119" height="18"/>
<text x="1703.1500000000003" y="252.5" text-anchor="middle">Heavy rain sets in</text>
</g>
<g class="transition" data-id="NGHE_TR_LEVEL1_TO_LEVEL3_RECOVERY">
<path d="M1872.6 162 C1872.6 128, 172 128, 172 162"/>
<rect class="lbl" x="953.3" y="125.5" width="138" height="18"/>
<text x="1022.3" y="138.5" text-anchor="middle">End of rain confirmed</text>
</g>
<g class="transition" data-id="NGHE_TR_RECOVERY_LEVEL3_TO_LEVEL4">
<path d="M292 210 C452.55000000000007 210, 452.55000000000007 210, 613.1000000000001 210"/>
<rect class="lbl" x="320.05000000000007" y="189" width="265" height="18"/>
<text x="452.55000000000007" y="202" text-anchor="middle">About 30 min of normal operation confirmed</text>
</g>
<g class="transition" data-id="NGHE_TR_MISSION_TO_COMPLETE">
<path d="M807.1000000000001 190 C1081.4 190, 1081.4 208, 1355.7 208"/>
<rect class="lbl" x="858.4000000000001" y="178" width="446" height="18"/>
<text x="1081.4" y="191" text-anchor="middle">72-hour mission completed [completed_volume &gt;= 38000 m3 within 72 hours]</text>
</g>
</g>
<line class="region-sep" x1="36" y1="391" x2="2082.6" y2="391"/>
<g class="region" data-id="r1">
<text class="region-label" x="46" y="432">battery_soc</text>
<g class="initial"><circle cx="12" cy="480" r="7"/><line x1="19" y1="480" x2="49" y2="480" marker-end="url(#t2a-arrow)"/></g>
<g class="state" data-id="NGHE_SIT_ECO_SWAP">
<rect x="52" y="452" width="202" height="56" rx="6"/>
<text x="68" y="472" font-size="14">Low-power battery swap</text>
<line x1="52" y1="482" x2="254" y2="482" stroke="#4B4F55" stroke-width=".8"/>
<text class="sv" x="68" y="498">battery_soc = 15 percent</text>
</g>
</g>
<line class="region-sep" x1="36" y1="531" x2="2082.6" y2="531"/>
<g class="region" data-id="r2">
<text class="region-label" x="46" y="572">network_mode</text>
<g class="initial"><circle cx="12" cy="620" r="7"/><line x1="19" y1="620" x2="49" y2="620" marker-end="url(#t2a-arrow)"/></g>
<g class="state" data-id="NGHE_SIT_CYBER_ISOLATED">
<rect x="475.5000000000001" y="592" width="214" height="56" rx="6"/>
<text x="491.5000000000001" y="612" font-size="14">Closed security network</text>
<line x1="475.5000000000001" y1="622" x2="689.5000000000001" y2="622" stroke="#4B4F55" stroke-width=".8"/>
<text class="sv" x="491.5000000000001" y="638">network_mode = closed_internal</text>
</g>
<g class="state" data-id="NGHE_SIT_NETWORK_OPEN">
<rect x="52" y="592" width="214" height="56" rx="6"/>
<text x="68" y="612" font-size="14">Public network in use</text>
<line x1="52" y1="622" x2="266" y2="622" stroke="#4B4F55" stroke-width=".8"/>
<text class="sv" x="68" y="638">network_mode = external_public</text>
</g>
<g class="transition" data-id="NGHE_TR_NETWORK_TO_ISOLATED">
<path d="M266 620 C370.75000000000006 620, 370.75000000000006 620, 475.5000000000001 620"/>
<rect class="lbl" x="274.75000000000006" y="599" width="192" height="18"/>
<text x="370.75000000000006" y="612" text-anchor="middle">Forged command packet injected</text>
</g>
</g></svg>